{% extends "accounts/base.html" %}
{% block auth %}<h2>Konto erstellen</h2>
<form method="post">{% csrf_token %}{% for f in form %}<div class="field"><label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}{{ f.errors }}</div>{% endfor %}{{ form.non_field_errors }}<button>Konto erstellen</button></form>
<p class="alt"><a href="{% url 'login' %}">Zurück zur Anmeldung</a></p>{% endblock %}
