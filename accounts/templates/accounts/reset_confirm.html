{% extends "accounts/base.html" %}
{% block auth %}{% if validlink %}<h2>Neues Passwort festlegen</h2>
<form method="post">{% csrf_token %}{% for f in form %}<div class="field"><label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}{{ f.errors }}</div>{% endfor %}
<button>Passwort speichern</button></form>
{% else %}<h2>Link ungültig</h2><p>Der Link ist abgelaufen oder wurde schon verwendet.</p>
<p class="alt"><a href="{% url 'forgot' %}">Neuen Link anfordern</a></p>{% endif %}{% endblock %}
