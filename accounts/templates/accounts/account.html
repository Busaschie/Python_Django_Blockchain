{% extends "accounts/base.html" %}
{% block auth %}<h2>Konto</h2><p class="muted">{{ user.username }}</p>
<h3>Passwort ändern</h3>
<form method="post">{% csrf_token %}{% for f in form %}<div class="field"><label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}{{ f.errors }}</div>{% endfor %}{{ form.non_field_errors }}<button>Passwort ändern</button></form>
<p class="alt"><a href="{% url 'index' %}">← Zur App</a></p>{% endblock %}
