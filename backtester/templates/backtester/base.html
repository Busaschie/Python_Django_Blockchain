<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Backtester</title>
<style>
 :root{color-scheme:dark;--bg:#121212;--card:#1c1c1c;--line:#333;--ink:#e8e8e8;--ink2:#c4c4c4;--muted:#9a9a9a;--accent:#417690;--link:#81d4fa;--head:#205067;--title:#f5dd5d;--field:#121212;--sel:#1b2f3b;--bad:#ff7a7a;--good:#6fcf8a}
 *{box-sizing:border-box}
 body{font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);margin:0}
 .wrap{max-width:1750px;margin:0 auto;padding:1rem 1.25rem 2rem}
 h1{font-size:1.3rem;margin:0} h1 a{color:var(--title);text-decoration:none}
 .topbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;background:var(--head);border-radius:10px;padding:.7rem 1rem;margin-bottom:1rem}
 .topbar a{color:#fff} .topbar h1 a{color:var(--title)}
 .chains label:hover{border-color:var(--accent)}
 h2{font-size:1.1rem;margin:0 0 .6rem} h3{font-size:.98rem;margin:.2rem 0 .5rem} h4{font-size:.92rem;margin:0 0 .35rem}
 a{color:var(--link)} small,.small{color:var(--muted);font-size:.82rem} .muted{color:var(--muted)}
 .err{color:var(--bad)} .good{color:var(--good)}

 /* Auswahl der Chain (ganz oben) */
 .chains{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
 .chains input{position:absolute;opacity:0;pointer-events:none}
 .chains label{padding:.55rem 1.3rem;border:1px solid var(--line);border-radius:999px;background:var(--card);
   cursor:pointer;font-weight:600}
 .chains label small{margin-left:.4rem;font-weight:400}
 .chains input:checked + label{background:var(--accent);border-color:var(--accent);color:#fff}
 .chains input:checked + label small{color:#d6e9f2}
 .chains input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}

 /* Drei Spalten */
 .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 300px;gap:1rem;align-items:start}
 @media (max-width:1150px){.cols{grid-template-columns:minmax(0,1fr)}}
 .box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem;margin-bottom:1rem}
 .scroll{overflow-x:auto}
 table{border-collapse:collapse;width:100%} td,th{padding:.28rem .5rem;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem}
 th{font-weight:600;color:var(--ink2)}
 .field{margin:.4rem 0} .field label{display:block;font-size:.82rem;color:var(--muted)}
 .lbl{display:flex;align-items:center;gap:.35rem;margin-bottom:.15rem}
 /* Erklärungs-Symbol (i) und Tooltip */
 .tip{display:inline-flex;align-items:center;justify-content:center;flex:none;width:1.05rem;height:1.05rem;padding:0;margin:0;
   border:1px solid var(--muted);border-radius:50%;background:none;color:var(--muted);font:italic 700 .72rem/1 Georgia,serif;cursor:help}
 .tip:hover,.tip:focus-visible{background:var(--accent);border-color:var(--accent);color:#fff;outline:none}
 .chains .tip{align-self:center}
 .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
 #tip{position:absolute;z-index:1000;display:none;max-width:320px;background:#0b0b0b;border:1px solid #444;color:#fff;padding:.55rem .7rem;border-radius:6px;
   font-size:.8rem;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.28);pointer-events:none}
 .field input:not([type=radio]),.field select{width:100%;padding:.4rem .5rem;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--field);color:var(--ink)}
 button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:.55rem 1rem;font:inherit;font-weight:600;cursor:pointer;margin-top:.5rem}
 button.secondary{background:transparent;color:var(--link);border:1px solid var(--accent);margin-left:.4rem}
 .sect{margin:.9rem 0 .2rem;padding-top:.6rem;border-top:1px solid var(--line);font-size:.9rem}
 .errorlist{margin:.2rem 0;padding:0;list-style:none;color:var(--bad);font-size:.82rem}

 /* Historie */
 .hist .grp{margin-bottom:.9rem} .hist ul{list-style:none;margin:0;padding:0}
 .hist li{padding:.35rem .5rem;border-radius:6px;border-left:3px solid transparent}
 .hist li a{display:block;font-weight:500;text-decoration:none}
 .hist li{position:relative} .hist li a:first-of-type{padding-right:1.6rem}
 .delform{position:absolute;top:.2rem;right:.2rem;margin:0}
 button.del{background:none;border:0;color:var(--bad);font:700 1.15rem/1 system-ui,sans-serif;padding:.1rem .35rem;margin:0;border-radius:4px}
 button.del:hover,button.del:focus-visible{background:var(--bad);color:#fff;outline:none}
 .aiul{margin:.2rem 0 .6rem;padding-left:1.2rem} .aiul li{margin:.15rem 0} #aibox h4{margin:.7rem 0 .1rem;color:var(--ink2)}
 .plaus h3{margin:0;display:flex;align-items:center;gap:.5rem}
 .dot{display:inline-block;width:.8rem;height:.8rem;border-radius:50%;background:var(--muted);flex:none}
 .dot.lv-ok{background:var(--good)} .dot.lv-warn{background:#f5c542} .dot.lv-bad{background:var(--bad)}
 .plaus details{margin-top:.5rem} .plaus summary{cursor:pointer;color:var(--link);font-size:.88rem}
 .plaus h4{margin:.7rem 0 .2rem;color:var(--ink2)} .plaus ul{list-style:none;margin:0;padding:0}
 .plaus li{display:flex;gap:.5rem;align-items:baseline;padding:.2rem 0;border-bottom:1px solid var(--line);font-size:.88rem}
 .plaus li .dot{width:.6rem;height:.6rem;position:relative;top:.05rem} .plaus li span.d{color:var(--muted)}
 .hist li.cur{background:var(--sel);border-left-color:var(--accent)}
 .hist li + li{border-top:1px solid var(--line)}

 /* Legende */
 #legende{margin-top:1.5rem}
 .legend{column-count:2;column-gap:2.5rem}
 @media (max-width:900px){.legend{column-count:1}}
 .legend h3{margin-top:1rem;break-after:avoid} .legend h3:first-child{margin-top:0}
 .term{break-inside:avoid;margin-bottom:.55rem} .term dt{font-weight:600} .term dd{margin:0 0 0 .1rem;color:var(--ink2)}
 dl{margin:0}
</style></head><body>
<div class="wrap">
<div class="topbar">
<h1><a href="{% url 'index' %}">Trading Backtester</a></h1>
{% if user.is_authenticated %}<form method="post" action="{% url 'logout' %}" style="margin:0;font-size:.88rem">{% csrf_token %}
<a href="{% url 'account' %}">Konto ({{ user.username }})</a>
<button class="secondary" style="padding:.25rem .7rem;margin:0 0 0 .4rem;color:#fff;border-color:#fff">Abmelden</button></form>{% endif %}</div>
{% block content %}{% endblock %}
</div></body></html>
